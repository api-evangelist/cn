name: cn
description: 'cn is the China-region web presence (cn.ausperbio.com) of AusperBio Therapeutics
  (Hangzhou Ausper Bio / 杭州浩博医药有限公司), a Phase II clinical-stage biopharmaceutical company
  dedicated to transforming HBV treatment toward a functional cure and advancing oligonucleotide
  therapeutics. AusperBio leverages its proprietary Med-Oligo ASO platform with targeted
  delivery technologies to apply antisense oligonucleotide (ASO) therapeutics across viral
  infections, metabolic conditions, genetic disorders, and immune diseases; its lead candidate
  AHB-137 is an unconjugated ASO advancing through Phase II/III trials for chronic hepatitis B.
  Surfaced as a portfolio company of Qiming Venture Partners and added to the API Evangelist
  network as a stub; the company publishes a marketing website but no public developer or API surface.'
